name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }} (Live Redis, RabbitMQ, NATS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://127.0.0.1:6379
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
      NATS_URL: nats://127.0.0.1:4222

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start NATS with JetStream
        run: docker run --detach --name lazy-layers-ci-nats --publish 4222:4222 nats:2.10-alpine -js

      - name: Wait for live service containers (Redis, RabbitMQ, NATS)
        run: |
          node -e '
            const net = require("net");
            const checkPort = (host, port, timeout = 30000) => new Promise((resolve, reject) => {
              const start = Date.now();
              const tryConnect = () => {
                const s = net.createConnection({ host, port });
                s.on("connect", () => { s.destroy(); resolve(); });
                s.on("error", () => {
                  if (Date.now() - start > timeout) reject(new Error("Timeout waiting for " + host + ":" + port));
                  else setTimeout(tryConnect, 500);
                });
              };
              tryConnect();
            });
            Promise.all([
              checkPort("127.0.0.1", 6379),
              checkPort("127.0.0.1", 5672),
              checkPort("127.0.0.1", 4222),
            ]).then(() => console.log("✓ Live services ready on Redis:6379, RabbitMQ:5672, NATS:4222"))
              .catch((err) => { console.error(err); process.exit(1); });
          '

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build Library (ESM + CommonJS)
        run: npm run build

      - name: Run Full Test Suite (Unit, Concurrency, E2E, Live Services)
        run: npm test

      - name: Verify Benchmark Pipeline
        run: node benchmarks/run.mjs

  site-build:
    name: Build Website & Validate Static Bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install site dependencies & build static site
        run: |
          cd site
          npm ci
          npm run build

  documentation-build:
    name: Lint, Typecheck & Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: documentation/package-lock.json

      - name: Install documentation dependencies
        run: npm ci
        working-directory: documentation

      - name: Lint documentation
        run: npm run lint
        working-directory: documentation

      - name: Typecheck documentation
        run: npm run types:check
        working-directory: documentation

      - name: Build documentation
        run: npm run build
        working-directory: documentation
